name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · content · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # `unlocks` is derived from `prerequisites`. If the committed files disagree with what
      # the script would generate, someone hand-edited the graph. Fail before we ship it.
      - name: Skill graph is derived and acyclic
        run: node scripts/derive-unlocks.ts --check

      - name: Validate content
        run: pnpm validate:content

      # docs/05-DESIGN-DIRECTION.md §2 and §10.4. v1 aliased --correct to --p3 and --incorrect
      # to --p5: the colour that told a student they were wrong was the same variable that
      # labelled a 5-point question, and nothing caught it for a whole phase. This does.
      - name: Reserved colours stay reserved
        run: pnpm check:palette

      # The full RLS proof (supabase/tests/rls.test.sql) needs a running Postgres with pgTAP.
      # The shape checks in scripts/__tests__/rls-shape.test.ts run as part of `pnpm test`
      # above and need no database. See supabase/README.md.

      - name: Accessibility
        run: pnpm a11y

      - name: Build
        run: pnpm build
